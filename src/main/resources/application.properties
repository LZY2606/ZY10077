spring.application.name=migration-lab
server.port=${PORT:5209}
migration-lab.database-url=${MIGRATION_LAB_DB:jdbc:h2:file:./data/migration-lab;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE;DB_CLOSE_ON_EXIT=FALSE}
spring.datasource.url=${migration-lab.database-url}
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.sql.init.mode=always
spring.sql.init.schema-locations=classpath:schema-control.sql
spring.jackson.default-property-inclusion=non_null
spring.threads.virtual.enabled=true
